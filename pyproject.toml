[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cockpit-mcp"
dynamic = ["version"]
description = "Portable Cockpit bundle extractor + MCP server"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "mslacken" }]
keywords = ["cockpit", "mcp", "model-context-protocol", "linux", "administration"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "mcp>=1.0",
    "tree-sitter>=0.23",
    "tree-sitter-javascript>=0.23",
]

[project.scripts]
cockpit-mcp = "cockpit_mcp_server_ng:main"
cockpit-bridge = "cockpit_bridge:main"
cockpit-js-parser = "cockpit_js_parser:main"
cockpit-list-tools = "cockpit_list_tools:main"

[project.urls]
Documentation = "https://github.com/mslacken/cockpit-mcp"

[tool.setuptools.dynamic]
version = { file = ["VERSION"] }

[tool.setuptools]
# The project ships four flat, top-level modules that import each other by
# bare name (not `from cockpit_mcp import ...`), so install them as top-level
# modules rather than as a package.
py-modules = [
    "cockpit_mcp_server_ng",
    "cockpit_bridge",
    "cockpit_js_parser",
    "cockpit_list_tools",
]
